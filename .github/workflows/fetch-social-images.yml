name: Fetch social images
on:
  push:
    branches: [claude/project-thread-71ovwj]
    paths: [social/urls.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          mkdir -p social/images
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -fsSL -o "social/images/$name.png" "$url"
          done < social/urls.txt
          ls -la social/images
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add social/images
          git commit -m "Add exported social post images"
          git push
